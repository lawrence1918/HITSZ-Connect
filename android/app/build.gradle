plugins { id "com.android.application" }

def localSigningPropertiesFile = rootProject.file("local-signing.properties")
def localSigningProperties = new Properties()
if (localSigningPropertiesFile.exists()) {
    localSigningPropertiesFile.withInputStream { localSigningProperties.load(it) }
}

android {
    namespace "com.hitsz.connect"
    compileSdk 34

    defaultConfig {
        applicationId "com.hitsz.connect"
        minSdk 26
        targetSdk 34
        versionCode 10314
        versionName "1.3.14"
    }

    if (localSigningPropertiesFile.exists()) {
        signingConfigs {
            release {
                storeFile rootProject.file(localSigningProperties["storeFile"])
                storePassword localSigningProperties["storePassword"]
                keyAlias localSigningProperties["keyAlias"]
                keyPassword localSigningProperties["keyPassword"]
            }
        }

        buildTypes {
            release {
                signingConfig signingConfigs.release
            }
        }
    }

    // gomobile's AAR is generated by the repository workflow. Keeping it in
    // app/libs makes local Android Studio builds and CI use the same artifact.
    sourceSets { main { jniLibs.srcDirs = ["src/main/jniLibs"] } }
}

dependencies {
    implementation files("libs/zju-connect.aar")
}
