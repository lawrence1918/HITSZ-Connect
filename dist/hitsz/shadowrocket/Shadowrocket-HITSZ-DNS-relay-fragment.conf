# hitsz-connect -profile hitsz starts the local SOCKS5 proxy at
# 127.0.0.1:1080 and the HITSZ DNS relay at 127.0.0.1:53535.
#
# Merge this into the active Shadowrocket configuration. Put the [Rule]
# entries before generic private-IP DIRECT rules and FINAL. For direct-IP
# campus services, also merge the generated IP-CIDR entries from
# -shadowrocket-config-fragment; they are specific to the signed-in account
# and restricted to 10.248.0.0/16 through 10.250.0.0/16 to avoid local-LAN
# collisions.

[General]
always-real-ip = *

[Proxy]
# This is a local split-proxy, not the selected foreign node.
HITSZ-aTrust = socks5, 127.0.0.1, 1080

[Rule]
# HITSZ profile makes this local proxy fail closed for addresses not granted
# by aTrust, avoiding a Shadowrocket direct-dial loop.
DOMAIN-SUFFIX,hitsz.edu.cn,HITSZ-aTrust

[Host]
hitsz.edu.cn = server:udp://127.0.0.1:53535
*.hitsz.edu.cn = server:udp://127.0.0.1:53535
