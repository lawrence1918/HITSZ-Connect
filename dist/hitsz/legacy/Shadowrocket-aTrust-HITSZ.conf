# Shadowrocket 2.2.90 (3378) for macOS
# HITSZ aTrust coexistence configuration
#
# Start order:
#   1. Keep Quantumult X disconnected.
#   2. Connect the official aTrust client.
#   3. Start hitsz-dns-tcp-relay (127.0.0.1:53535/UDP -> 10.248.98.30:53/TCP).
#   4. Import the existing subscription into Shadowrocket and select a node.
#   5. Select this configuration and start Shadowrocket.
#   6. Keep "Force Route" and "Include All Networks" disabled.

[General]
# TUN-only capture lets aTrust's more-specific routes take precedence.
compatibility-mode = 3

# Do not exclude 10.248.98.30/32: doing so creates an en0 host route that
# overrides aTrust's 10.248.64.0/18 route and makes the HITSZ DNS unreachable.
skip-proxy = localhost, *.local, captive.apple.com
tun-excluded-routes = 127.0.0.0/8, 169.254.0.0/16, 224.0.0.0/4, 255.255.255.255/32, 239.255.255.250/32, 76.76.2.0/32, 194.242.2.2/32, ff02::fb/128

# All ordinary DNS, fallback DNS, and proxy-node DNS use encrypted DoH only.
dns-server = https://freedns.controld.com/p0#no-h3, https://base.dns.mullvad.net/dns-query#no-h3
fallback-dns-server = https://freedns.controld.com/p0#no-h3, https://base.dns.mullvad.net/dns-query#no-h3
proxy-dns-server = https://freedns.controld.com/p0#no-h3, https://base.dns.mullvad.net/dns-query#no-h3
dns-direct-system = false
dns-direct-fallback-proxy = false

# Real-IP mode avoids the 198.18.0.0/16 Fake-IP collision with aTrust.
always-real-ip = *
private-ip-answer = true
ipv6 = false
prefer-ipv6 = false

# Redirect common hard-coded resolvers into Shadowrocket DNS. Any remaining
# cleartext port-53 request is rejected by [Rule].
hijack-dns = 8.8.8.8:53, 8.8.4.4:53, 1.1.1.1:53, 1.0.0.1:53, 9.9.9.9:53, 149.112.112.112:53, 223.5.5.5:53, 223.6.6.6:53, 119.29.29.29:53, 114.114.114.114:53
udp-policy-not-supported-behaviour = REJECT
icmp-auto-reply = true

[Proxy]
# Subscription nodes are imported in Shadowrocket itself, not embedded here.

[Proxy Group]
# PROXY below means the node selected on Shadowrocket's home page.

[Rule]
# HITSZ traffic follows routes installed by the official aTrust client.
DOMAIN-SUFFIX,hitsz.edu.cn,DIRECT
IP-CIDR,10.248.98.30/32,DIRECT,no-resolve

# Fixed bootstrap IPs make DoH independent of system DNS. The DNS payload is
# still carried only inside HTTPS.
IP-CIDR,76.76.2.0/32,DIRECT,no-resolve
IP-CIDR,194.242.2.2/32,DIRECT,no-resolve

# Fail closed for cleartext DNS that was not caught by hijack-dns.
DST-PORT,53,REJECT

# Local/private traffic, after the DNS leak guard.
IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
IP-CIDR,192.168.0.0/16,DIRECT,no-resolve

# Mainland addresses are direct; everything else uses the selected node.
GEOIP,CN,DIRECT
FINAL,PROXY

[Host]
# Static DoH bootstrap prevents any system-DNS lookup of the DoH hostnames.
freedns.controld.com = 76.76.2.0
base.dns.mullvad.net = 194.242.2.2

# Only the HITSZ root domain and its subdomains use the local relay, which
# ultimately queries 10.248.98.30:53/TCP through aTrust.
hitsz.edu.cn = server:udp://127.0.0.1:53535
*.hitsz.edu.cn = server:udp://127.0.0.1:53535
localhost = 127.0.0.1

[URL Rewrite]
# Intentionally empty.

[Header Rewrite]
# Intentionally empty.

[Body Rewrite]
# Intentionally empty.

[Map Local]
# Intentionally empty.

[Script]
# Intentionally empty.

[MITM]
# Intentionally empty; HTTPS decryption is neither needed nor enabled.
